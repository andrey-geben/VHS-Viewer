[tool.ruff]
# Максимальная длина строки. 100 — компромисс: код не «разъезжается», но и не рвётся на каждом слове.
line-length = 100
# Под какую версию Python проверять синтаксис. Поставь ту, что у тебя в проекте (например, "py310").
target-version = "py310"
# Эти папки линтер не трогает.
exclude = [".venv", "venv", "build", "dist", "__pycache__"]

[tool.ruff.lint]
# Наборы правил, которые включаем:
# E, W — базовые ошибки/предупреждения стиля (pycodestyle)
# F     — реальные ошибки: неиспользуемые импорты/переменные и т.п. (pyflakes)
# I     — порядок импортов (isort)
# UP    — подсказки под современный Python (устаревший синтаксис)
# B     — «ловушки» логики (bugbear)
# SIM   — можно упростить код
# C4    — можно упростить генераторы/списки
# N     — именование (snake_case и т.п.)
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "N"]

[tool.ruff.lint.per-file-ignores]
# В __init__.py импорты часто нужны «просто чтобы были» — не ругаемся на них.
"__init__.py" = ["F401"]

[tool.ruff.format]
# Единый стиль кавычек, как в black.
quote-style = "double"