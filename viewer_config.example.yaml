# =====================================================================
#  VHS-Viewer — пример конфигурации
# =====================================================================
#  Скопируйте в viewer_config.yaml и заполните своими значениями:
#      copy viewer_config.example.yaml viewer_config.yaml
# =====================================================================

title: VHS-Viewer
layout: 2x2

# --- Серверы VHS-Streamer ---
# Укажите один или несколько серверов. Viewer сам подтянет с них
# список потоков через /api/public/streams.
servers:
  - name: Главный
    url: http://192.168.1.101:8000

# --- Потоки ---
# Пустой список — заполнится автоматически кнопкой
# «Обновить список потоков» в настройках UI.
streams: []

# --- Безопасность ---
security:
  # Если false — авторизация отключена (доступ открыт всем в сети).
  # НЕ рекомендуется для production.
  auth_enabled: true

  # Время жизни сессии в часах.
  session_lifetime_hours: 24

  # Пользователи. Пароли хранятся в открытом виде —
  # обеспечьте защиту самого файла viewer_config.yaml.
  users:
    - username: admin
      password: "CHANGE-ME"
      role: admin
    - username: operator
      password: "CHANGE-ME"
      role: admin