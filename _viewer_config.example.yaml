title: VHS-Viewer
layout: 2x2
servers:
- name: local
  url: http://127.0.0.1:8100
  api_key: CHANGE-ME-streamer-key
# Viewer принимает несколько Streamer: добавьте ещё записи с их URL и ключами.
streams:
- name: Встроенная камера / analog_1_s1
  url: http://127.0.0.1:8889/analog_1_s1/
  enabled: true
- name: 3 / 3_s1
  url: http://127.0.0.1:8889/3_s1/
  enabled: true
- name: sub_streem / 4floor2_s1
  url: http://127.0.0.1:8889/4floor2_s1/
  enabled: true
integration:
  service_name: viewer
  # Ключ Viewer для VHS-Security: X-VHS-Key / X-Ingest-Token
  ingest_key: CHANGE-ME-viewer-key

security:
  auth_enabled: true
  session_lifetime_hours: 24
  users:
  - username: admin
    password: admin
    role: admin
  - username: operator
    password: CHANGE-ME
    role: viewer
analytics:
  enabled: true
  autostart: true
  objects_per_camera: false
  streamer_url: http://127.0.0.1:8100
  rtsp_base: null
  poll_interval: 15
  conf_threshold: 0.5
  object_model: yolov8n.pt
  object_conf: 0.4
  object_imgsz: 640
  analyze_every_n: 1
  cameras:
    default:
      enabled: false
      plates: false
      objects: []
      analyze_every_n: 2
      object_imgsz: 416
    analog_1_s1:
      enabled: true
      plates: true
      objects:
      - person
      - dog
      - bear
      analyze_every_n: 2
      object_imgsz: 416
    3_s1:
      enabled: true
      plates: false
      objects:
      - person
      - dog
      analyze_every_n: 2
      object_imgsz: 416
    4floor2_s1:
      enabled: true
      plates: false
      objects:
      - person
      - dog
      - cat
# Видеоархив Viewer. Реле и сообщения настраиваются в VHS-Security.
archive:
  enabled: false
  mode: events            # events | always | off
  path: ''                # пусто = папка Viewer/archive
  quota_gb: 50            # 0 = без ограничения
  event_types: [plate, person, vehicle, animal]
  clip_seconds: 15
  cooldown_sec: 30
  rtsp_port: 8554
  ffmpeg_path: ''
